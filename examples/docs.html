<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearBox2D Documentation | Protocol Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="./examples-styles.css">
    <style>
        #doc-content {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            color: var(--text-main);
            line-height: 1.6;
        }
        #doc-content h1 {
            font-family: var(--font-header);
            color: var(--accent-cyan);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        #doc-content h2 {
            font-family: var(--font-header);
            color: var(--accent-purple);
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        #doc-content h3 {
            color: var(--accent-cyan);
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        #doc-content p {
            margin-bottom: 1rem;
            color: var(--text-muted);
        }
        #doc-content code {
            font-family: var(--font-mono);
            background-color: rgba(30, 41, 59, 0.5);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85em;
            color: var(--accent-cyan);
        }
        #doc-content pre {
            background-color: #0d1117;
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            margin: 1.5rem 0;
            position: relative;
        }
        #doc-content pre code {
            background-color: transparent;
            padding: 0;
            color: #c9d1d9;
            font-size: 0.9rem;
            line-height: 1.6;
            border-radius: 0;
        }
        /* Add a small indicator for the language if available */
        #doc-content pre[data-lang]::before {
            content: attr(data-lang);
            position: absolute;
            top: 0;
            right: 0;
            padding: 4px 8px;
            font-size: 0.6rem;
            font-family: var(--font-header);
            color: var(--text-muted);
            text-transform: uppercase;
            background: var(--bg-surface);
            border-bottom-left-radius: 4px;
            border-left: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            opacity: 0.5;
        }
        #doc-content ul, #doc-content ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
            color: var(--text-muted);
        }
        #doc-content li {
            margin-bottom: 0.5rem;
        }
        #doc-content a {
            color: var(--accent-cyan);
            text-decoration: none;
        }
        #doc-content a:hover {
            text-decoration: underline;
        }
        #doc-content blockquote {
            border-left: 4px solid var(--accent-purple);
            padding-left: 1rem;
            margin: 1rem 0;
            font-style: italic;
            color: var(--text-muted);
        }
        .sidebar-link {
            display: block;
            padding: 8px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition);
            border-left: 2px solid transparent;
            cursor: pointer;
        }
        .sidebar-link:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }
        .sidebar-link.active {
            background: linear-gradient(to right, rgba(0, 242, 255, 0.1), transparent);
            color: var(--accent-cyan);
            border-left: 2px solid var(--accent-cyan);
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <h2>Documentation</h2>
            <button id="sidebar-toggle"><i class="fas fa-bars"></i></button>
        </div>
        <ul id="docs-list">
            <!-- Documentation categories and pages will be dynamically generated -->
        </ul>
    </div>
    
    <div id="main">
        <div id="main-header">
            <h1 id="doc-title">Loading documentation...</h1>
            <a href="index.html" style="color: var(--accent-cyan); text-decoration: none; font-family: var(--font-header); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
        
        <div id="content">
            <div id="doc-content">
                <!-- Markdown content will be rendered here -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script type="module">
        import MarkdownParser from './utils/markdown.ts';
        
        // Use Vite's raw loader to get the todo list
        const todoMarkdown = import.meta.glob('../docs/todo.md', { query: '?raw', eager: true })['../docs/todo.md'].default;
        
        // Use Vite's raw loader to get all doc files
        const docFiles = import.meta.glob('../docs/*.md', { query: '?raw', eager: true });

        function parseTodo(content) {
            const lines = content.split('\n');
            const categories = [];
            let currentCategory = null;

            for (const line of lines) {
                if (line.startsWith('##')) {
                    currentCategory = {
                        name: line.replace(/^##\s+/, '').trim(),
                        pages: []
                    };
                    categories.push(currentCategory);
                } else if (line.startsWith('-')) {
                    // Match pattern: - `filename.md`: Title
                    const match = line.match(/- `([^`]+\.md)`:\s*(.*)/);
                    if (match && currentCategory) {
                        currentCategory.pages.push({
                            file: match[1],
                            title: match[2].trim().replace(/\.$/, '')
                        });
                    }
                }
            }
            return categories;
        }

        const categories = parseTodo(todoMarkdown);
        const docsList = document.getElementById('docs-list');
        const docTitle = document.getElementById('doc-title');
        const docContent = document.getElementById('doc-content');

        function populateSidebar() {
            categories.forEach(category => {
                const catHeader = document.createElement('li');
                catHeader.className = 'section';
                catHeader.textContent = category.name;
                docsList.appendChild(catHeader);

                category.pages.forEach(page => {
                    const pageItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.className = 'sidebar-link';
                    link.textContent = page.title;
                    link.href = `#${page.file.replace('.md', '')}`;
                    link.dataset.file = page.file;
                    
                    pageItem.appendChild(link);
                    docsList.appendChild(pageItem);
                });
            });
        }

        async function loadPage() {
            const hash = window.location.hash.substring(1);
            const fileName = hash ? `${hash}.md` : (categories[0]?.pages[0]?.file || '');
            
            if (!fileName) return;

            // Update active state in sidebar
            document.querySelectorAll('.sidebar-link').forEach(link => {
                if (link.getAttribute('href') === `#${fileName.replace('.md', '')}`) {
                    link.classList.add('active');
                    docTitle.textContent = link.textContent;
                } else {
                    link.classList.remove('active');
                }
            });

            const content = docFiles[`../docs/${fileName}`]?.default;
            if (content) {
                docContent.innerHTML = MarkdownParser.parse(content);
                // Highlight code blocks
                docContent.querySelectorAll('pre code').forEach((block) => {
                    const pre = block.parentElement;
                    const langClass = Array.from(block.classList).find(c => c.startsWith('language-'));
                    if (langClass) {
                        pre.setAttribute('data-lang', langClass.replace('language-', ''));
                    }
                    hljs.highlightElement(block);
                });
            } else {
                docContent.innerHTML = `<p>Error: Could not load documentation file "${fileName}".</p>`;
            }
            
            // Scroll to top
            document.getElementById('main').scrollTop = 0;
        }

        window.addEventListener('hashchange', loadPage);
        populateSidebar();
        loadPage();

        // Sidebar toggle for mobile
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });
    </script>
</body>
</html>
