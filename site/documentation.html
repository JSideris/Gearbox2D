<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gearbox2D Documentation | Protocol Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="./styles/examples-styles.css">
    <link rel="stylesheet" href="./styles/docs-content-styles.css">
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <h2 id="sidebar-title">Documentation</h2>
            <div id="sidebar-actions">
                <a href="index.html" class="sidebar-icon-button" title="Home"><i class="fas fa-home"></i></a>
                <button id="sidebar-toggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
        <ul id="docs-list">
            <!-- Documentation categories and pages will be dynamically generated -->
        </ul>
    </div>
    
    <div id="main">
        <div id="main-header">
            <div class="header-left">
                <a href="index.html" class="home-link" title="Back to Home">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <h1 id="doc-title">Loading documentation...</h1>
            </div>
        </div>
        
        <div id="content">
            <div id="doc-content">
                <!-- Markdown content will be rendered here -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script type="module">
        import MarkdownParser from './utils/markdown.ts';
        
        // Use Vite's raw loader to get the documentation structure
        const structureMarkdown = import.meta.glob('../docs/structure.md', { query: '?raw', eager: true })['../docs/structure.md'].default;
        
        // Use Vite's raw loader to get all doc files
        const docFiles = import.meta.glob(['../docs/*.md', '../plan.md'], { query: '?raw', eager: true });

        function parseStructure(content) {
            const lines = content.split('\n');
            const categories = [];
            let currentCategory = null;

            for (const line of lines) {
                if (line.startsWith('##')) {
                    currentCategory = {
                        name: line.replace(/^##\s+/, '').trim(),
                        pages: []
                    };
                    categories.push(currentCategory);
                } else if (line.startsWith('-')) {
                    // Match pattern: - `filename.md`: Title
                    const match = line.match(/- `([^`]+\.md)`:\s*(.*)/);
                    if (match && currentCategory) {
                        currentCategory.pages.push({
                            file: match[1],
                            title: match[2].trim().replace(/\.$/, '')
                        });
                    }
                }
            }
            return categories;
        }

        const categories = parseStructure(structureMarkdown);
        const docsList = document.getElementById('docs-list');
        const docTitle = document.getElementById('doc-title');
        const docContent = document.getElementById('doc-content');

        function populateSidebar() {
            categories.forEach(category => {
                const catHeader = document.createElement('li');
                catHeader.className = 'section';
                catHeader.textContent = category.name;
                docsList.appendChild(catHeader);

                category.pages.forEach(page => {
                    const pageItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.className = 'sidebar-link';
                    link.textContent = page.title;
                    link.href = `#${page.file.replace('.md', '')}`;
                    link.dataset.file = page.file;
                    
                    pageItem.appendChild(link);
                    docsList.appendChild(pageItem);
                });
            });

            // Add click listeners to sidebar links to collapse sidebar on mobile
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', () => {
                    if (isMobileLayout()) {
                        sidebar.classList.add('collapsed');
                    }
                });
            });
        }

        async function loadPage() {
            const hash = window.location.hash.substring(1);
            const fileName = hash ? `${hash}.md` : (categories[0]?.pages[0]?.file || '');
            
            if (!fileName) return;

            // Update active state in sidebar
            document.querySelectorAll('.sidebar-link').forEach(link => {
                if (link.getAttribute('href') === `#${fileName.replace('.md', '')}`) {
                    link.classList.add('active');
                    docTitle.textContent = link.textContent;
                } else {
                    link.classList.remove('active');
                }
            });

            let content = docFiles[`../docs/${fileName}`]?.default;
            
            // Special case for files in the root (like plan.md)
            if (!content && fileName === 'plan.md') {
                content = docFiles['../plan.md']?.default;
            }

            if (content) {
                docContent.innerHTML = MarkdownParser.parse(content);
                // Highlight code blocks
                docContent.querySelectorAll('pre code').forEach((block) => {
                    const pre = block.parentElement;
                    const langClass = Array.from(block.classList).find(c => c.startsWith('language-'));
                    if (langClass) {
                        pre.setAttribute('data-lang', langClass.replace('language-', ''));
                    }
                    hljs.highlightElement(block);
                });
            } else {
                docContent.innerHTML = `<p>Error: Could not load documentation file "${fileName}".</p>`;
            }
            
            // Scroll to top
            document.getElementById('main').scrollTop = 0;
        }

        window.addEventListener('hashchange', loadPage);
        populateSidebar();
        loadPage();

        // Responsive behavior ported from examples.html
        const isMobileLayout = () => window.innerWidth <= 768;
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // Auto-collapse sidebar on mobile on initial load
        if (isMobileLayout()) {
            sidebar.classList.add('collapsed');
        }

        // Resize handler
        window.addEventListener('resize', () => {
            // Auto-collapse sidebar if shrinking to mobile
            if (isMobileLayout() && !sidebar.classList.contains('collapsed')) {
                sidebar.classList.add('collapsed');
            }
        });

        // Close sidebar on click outside on mobile
        window.addEventListener('click', (e) => {
            if (isMobileLayout() && !sidebar.classList.contains('collapsed')) {
                if (!sidebar.contains(e.target) && !sidebarToggle.contains(e.target)) {
                    sidebar.classList.add('collapsed');
                }
            }
        });
    </script>
</body>
</html>
