<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gearbox2D Benchmarks | Performance Comparison</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="./styles/examples-styles.css">
    <style>
        .engine-tabs {
            display: flex;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 0 10px;
        }

        .engine-tab {
            padding: 12px 20px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .engine-tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .engine-tab.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
            background: rgba(0, 242, 255, 0.05);
        }

        #metrics {
            width: 240px;
        }

        /* Benchmark specific overrides */
        #main {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100vh;
            min-width: 0;
        }

        #main-header {
            padding: 16px 20px;
            flex-shrink: 0;
        }

        #content {
            padding: 0;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        #canvas-container {
            margin-bottom: 0;
            border-radius: 0;
            border-left: none;
            border-right: none;
            max-width: none !important;
            flex: 1;
            position: relative;
            background: #000;
            aspect-ratio: auto !important;
            min-height: 0;
        }

        #benchmark-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <h2 id="sidebar-title">Scenarios</h2>
            <div id="sidebar-actions">
                <a href="index.html" class="sidebar-icon-button" title="Home"><i class="fas fa-home"></i></a>
                <button id="reset-button-mobile" class="sidebar-icon-button" title="Reset"><i class="fas fa-redo-alt"></i></button>
                <button id="sidebar-toggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
        <ul id="scenarios-list">
            <!-- Scenarios will be dynamically generated -->
        </ul>
    </div>
    
    <div id="main">
        <div id="main-header">
            <div class="header-left">
                <a href="index.html" class="home-link" title="Back to Home">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <h1 id="scenario-name">Loading benchmark...</h1>
            </div>
            <div class="header-right">
                <button id="reset-button" title="Reset current benchmark">
                    <i class="fas fa-redo-alt"></i>
                    <span class="button-text">Reset</span>
                </button>
            </div>
        </div>
        
        <div id="content">
            <div class="engine-tabs">
                <div class="engine-tab active" data-engine="gearbox2d">Gearbox2D</div>
                <div class="engine-tab" data-engine="matterjs">Matter.js</div>
                <div class="engine-tab" data-engine="p2js">P2.js</div>
                <div class="engine-tab" data-engine="box2dwasm">Box2D-WASM</div>
            </div>
            
            <div id="canvas-container">
                <canvas id="benchmark-canvas"></canvas>
            </div>
            
            <div id="metrics">
                <div id="engine-name"><i class="fas fa-microchip"></i><span>Engine: -</span></div>
                <div id="step-time"><i class="fas fa-stopwatch"></i><span>Step Time: 0 μs</span></div>
                <div id="avg-step-time"><i class="fas fa-history"></i><span>Avg Step: 0 μs</span></div>
                <div id="bodies"><i class="fas fa-cubes"></i><span>Bodies: 0</span></div>
                <div id="memory" style="display: none;"><i class="fas fa-memory"></i><span>Memory: 0 MB</span></div>
                <div id="fps"><i class="fas fa-tachometer-alt"></i><span>FPS: 0</span></div>
            </div>

            <div id="status-text" style="padding: 10px 20px; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border);">Ready to benchmark</div>
        </div>
    </div>

    <!-- Engine Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p2.js/0.7.1/p2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/box2d-wasm@7.0.0/dist/umd/entry.js" data-box2d-dir="https://cdn.jsdelivr.net/npm/box2d-wasm@7.0.0/dist/umd"></script>

    <script type="module">
        import gearbox from 'gearbox2d';
        import { GearboxAdapter } from './utils/adapters/gearbox-adapter.ts';
        import { MatterAdapter, P2Adapter, Box2DAdapter } from './utils/adapters/competitor-adapters.ts';
        import { ProtocolRenderer } from './utils/protocol-renderer.ts';
        import { scenarios } from './benchmarks/scenarios.ts';

        const canvas = document.getElementById('benchmark-canvas');
        const renderer = new ProtocolRenderer(canvas);
        const scenarioNameH1 = document.getElementById('scenario-name');
        const scenariosList = document.getElementById('scenarios-list');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const resetButton = document.getElementById('reset-button');
        const resetButtonMobile = document.getElementById('reset-button-mobile');
        
        let adapter = null;
        let isRunning = false;
        let frameId = null;
        let stepTimes = [];
        let gearboxWorld = null;
        let currentScenarioKey = 'large-stack';

        // Initialize Gearbox once
        async function initGearbox() {
            try {
                await gearbox.init();
                gearboxWorld = gearbox.makeWorld();
                console.log("Gearbox2D initialized globally");
                // Auto-start first benchmark
                startBenchmark();
            } catch (e) {
                console.error("Failed to initialize Gearbox2D:", e);
            }
        }

        function populateScenarios() {
            scenariosList.innerHTML = '';
            Object.keys(scenarios).forEach(key => {
                const scenario = scenarios[key];
                const li = document.createElement('li');
                li.className = 'example' + (key === currentScenarioKey ? ' selected' : '');
                li.textContent = scenario.name;
                li.dataset.key = key;
                li.addEventListener('click', () => {
                    document.querySelectorAll('#scenarios-list li').forEach(el => el.classList.remove('selected'));
                    li.classList.add('selected');
                    currentScenarioKey = key;
                    startBenchmark();
                    
                    if (window.innerWidth <= 768) {
                        sidebar.classList.add('collapsed');
                    }
                });
                scenariosList.appendChild(li);
            });
        }

        function syncSize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            renderer.offsetX = canvas.width / 2;
            renderer.offsetY = canvas.height / 2;
        }
        window.addEventListener('resize', syncSize);
        syncSize();

        async function startBenchmark() {
            syncSize();
            const activeTab = document.querySelector('.engine-tab.active');
            const engineType = activeTab ? activeTab.dataset.engine : 'gearbox2d';
            const scenario = scenarios[currentScenarioKey];
            
            scenarioNameH1.textContent = scenario.name;
            
            if (adapter) {
                adapter.clear();
                adapter = null;
            }

            if (frameId) cancelAnimationFrame(frameId);

            switch (engineType) {
                case 'gearbox2d': 
                    if (!gearboxWorld) await initGearbox();
                    adapter = new GearboxAdapter(gearboxWorld); 
                    break;
                case 'matterjs': adapter = new MatterAdapter(); break;
                case 'p2js': adapter = new P2Adapter(); break;
                case 'box2dwasm': adapter = new Box2DAdapter(); break;
            }

            document.getElementById('engine-name').querySelector('span').textContent = `Engine: ${engineType.toUpperCase()}`;
            document.getElementById('status-text').textContent = `Initializing ${engineType}...`;

            try {
                await adapter.init();
                if (scenario) {
                    scenario.setup(adapter);
                }
                isRunning = true;
                stepTimes = [];
                lastTime = performance.now();
                loop();
                document.getElementById('status-text').textContent = `Running ${currentScenarioKey} on ${engineType}`;
            } catch (e) {
                console.error(e);
                document.getElementById('status-text').textContent = `Error: ${e.message}`;
            }
        }

        let lastTime = 0;
        let fpsLastTime = 0;
        let frames = 0;

        function loop() {
            if (!isRunning) return;

            const startTime = performance.now();
            adapter.step(1/60);
            const endTime = performance.now();
            
            const stepTimeMicros = (endTime - startTime) * 1000;
            stepTimes.push(stepTimeMicros);
            if (stepTimes.length > 60) stepTimes.shift();

            const avgStepMicros = stepTimes.reduce((a, b) => a + b, 0) / stepTimes.length;

            document.getElementById('step-time').querySelector('span').textContent = `Step Time: ${stepTimeMicros.toFixed(0)} μs`;
            document.getElementById('avg-step-time').querySelector('span').textContent = `Avg Step: ${avgStepMicros.toFixed(0)} μs`;
            document.getElementById('bodies').querySelector('span').textContent = `Bodies: ${adapter.getBodyCount()}`;

            const memoryEl = document.getElementById('memory');
            if (adapter.getMemoryUsage) {
                const mem = adapter.getMemoryUsage();
                memoryEl.style.display = 'flex';
                memoryEl.querySelector('span').textContent = mem < 1048576 ? `Memory: ${(mem / 1024).toFixed(2)} KB` : `Memory: ${(mem / 1048576).toFixed(2)} MB`;
            } else {
                memoryEl.style.display = 'none';
            }

            const frame = adapter.getDebugFrame();
            renderer.render(frame);

            frames++;
            const now = performance.now();
            if (now - fpsLastTime > 1000) {
                document.getElementById('fps').querySelector('span').textContent = `FPS: ${frames}`;
                frames = 0;
                fpsLastTime = now;
            }

            frameId = requestAnimationFrame(loop);
        }

        const handleReset = () => {
            startBenchmark();
            document.getElementById('status-text').textContent = 'Benchmark reset';
        };

        resetButton.addEventListener('click', handleReset);
        resetButtonMobile.addEventListener('click', handleReset);

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // Tab selection logic
        const tabs = document.querySelectorAll('.engine-tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                startBenchmark();
            });
        });

        // Initial setup
        populateScenarios();
        initGearbox();
    </script>
</body>
</html>
