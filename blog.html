		<style>
			:root {
				--bg-deep: #050505;
				--bg-surface: #0f172a;
				--bg-card: rgba(30, 41, 59, 0.7);
				--border: #1e293b;
				--accent-cyan: #00f2ff;
				--accent-purple: #a855f7;
				--text-main: #f1f5f9;
				--text-muted: #94a3b8;
			}

			body {
				font-family: "Inter", sans-serif;
				margin: 0;
				padding: 0;
				background-color: var(--bg-deep);
				color: var(--text-main);
			}

			header {
				padding: 60px 20px;
				text-align: center;
				border-bottom: 1px solid var(--border);
			}

				font-family: "Orbitron", sans-serif;
				font-size: 3em;
				background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple));

				background-clip: text;
				-webkit-text-fill-color: transparent;
			}

			.container {
				max-width: 800px;
				margin: 0 auto;
				padding: 40px 20px;
			}

			.nav {
				margin-bottom: 40px;
			}

			.nav a {
				color: var(--accent-cyan);
				text-decoration: none;
				margin-right: 20px;
				font-family: "Orbitron", sans-serif;
				font-size: 0.9em;
			}

			.post-preview {
				background: var(--bg-card);
				border: 1px solid var(--border);
				padding: 30px;
				border-radius: 12px;
				margin-bottom: 30px;
			}

			.post-preview h2 {
				margin-top: 0;
				color: var(--accent-cyan);
			}

			.post-date {
				font-size: 0.8em;
				color: var(--text-muted);
