<!DOCTYPE html>
<html>
<head>
    <title>CDN Bundle Test</title>
</head>
<body>
    <script src="dist/standalone/gearbox.js"></script>
    <script>
        console.log("Loading MT mode...");
        gearboxStandalone.init({ mode: 'mt' }).then(() => {
            console.log("MT mode loaded successfully!");
            console.log("Loading ST mode...");
            return gearboxStandalone.init({ mode: 'st' });
        }).then(() => {
            console.log("ST mode loaded successfully!");
            document.body.innerHTML = "<h1>SUCCESS</h1>";
        }).catch(err => {
            console.error("Failed:", err);
            document.body.innerHTML = "<h1>FAILED</h1><p>" + err.message + "</p>";
        });
    </script>
</body>
</html>
