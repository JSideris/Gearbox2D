<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gearbox2D Benchmarks | Performance Comparison</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700;900&family=Fira+Code&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
		<style>
			.engine-tabs {
				display: flex;
				background: var(--bg-surface);
				border-bottom: 1px solid var(--border);
				padding: 0 20px;
				gap: 15px;
			}

			.engine-tab {
				cursor: pointer;
				font-family: "Orbitron", sans-serif;
				font-size: 0.8rem;
				color: var(--text-muted);
				border-bottom: 2px solid transparent;
				transition: all 0.2s;
				text-transform: uppercase;
				letter-spacing: 1px;
				display: flex;
				align-items: stretch;
				padding: 0;
			}

			.engine-tab-text {
				padding: 12px 10px;
				display: flex;
				align-items: center;
			}

			.engine-toggle-wrapper {
				display: none;
				padding: 12px 10px;
				cursor: pointer;
				transition: all 0.2s;
				border-right: 1px solid transparent;
			}

			.engine-toggle-wrapper:hover {
				background: rgba(255, 255, 255, 0.1);
			}

			.engine-tab.active[data-engine="all"] ~ .engine-tab .engine-toggle-wrapper,
			.engine-tab.active[data-engine="all"] .engine-toggle-wrapper {
				display: flex;
				align-items: center;
				border-right: 1px solid var(--border);
			}

			.engine-toggle {
				width: 14px;
				height: 14px;
				cursor: pointer;
				accent-color: var(--accent-cyan);
				margin: 0;
			}

			.engine-tab:hover {
				color: var(--text-main);
				background: rgba(255, 255, 255, 0.05);
			}

			.engine-tab.active {
				color: var(--accent-cyan);
				border-bottom-color: var(--accent-cyan);
				background: rgba(0, 242, 255, 0.05);
			}

			#metrics {
				width: 320px;
			}

			#metric-chart-container {
				width: 100%;
				height: 180px;
				margin-top: 15px;
				padding-top: 10px;
				border-top: 1px solid var(--border);
			}

			#metric-chart {
				width: 100% !important;
				height: 100% !important;
			}

			/* Benchmark specific overrides */
			#main {
				overflow: hidden;
				display: flex;
				flex-direction: column;
				flex: 1;
				height: 100vh;
				min-width: 0;
			}

			#main-header {
				padding: 16px 20px;
				flex-shrink: 0;
			}

			#content {
				padding: 0;
				display: flex;
				flex-direction: column;
				flex: 1;
				overflow: hidden;
				min-height: 0;
				position: relative;
			}

			#canvas-container {
				margin-bottom: 0;
				border-radius: 0;
				border-left: none;
				border-right: none;
				max-width: none !important;
				flex: 1;
				position: relative;
				background: #000;
				aspect-ratio: auto !important;
				min-height: 0;
				display: grid;
			}

			#canvas-container.all-mode {
				background: var(--border);
				gap: 1px;
			}

			/* Layouts for all-mode */
			#canvas-container.all-mode.layout-4 {
				grid-template-columns: 1fr 1fr;
				grid-template-rows: 1fr 1fr;
			}

			#canvas-container.all-mode.layout-3 {
				grid-template-columns: 1fr 1fr;
				grid-template-rows: 1fr 1fr;
			}

			#canvas-container.all-mode.layout-2 {
				grid-template-columns: 1fr 1fr;
				grid-template-rows: 1fr;
			}

			#canvas-container.all-mode.layout-1 {
				grid-template-columns: 1fr;
				grid-template-rows: 1fr;
			}

			.engine-canvas-wrapper {
				position: relative;
				background: #000;
				width: 100%;
				height: 100%;
				overflow: hidden;
			}

			.engine-canvas-wrapper.empty-slot {
				background: #050505;
			}

			.engine-label {
				position: absolute;
				top: 10px;
				left: 10px;
				background: rgba(0, 0, 0, 0.7);
				color: var(--accent-cyan);
				padding: 4px 10px;
				font-family: "Orbitron", sans-serif;
				font-size: 0.6rem;
				letter-spacing: 1px;
				border: 1px solid var(--border);
				border-radius: 2px;
				z-index: 5;
				pointer-events: none;
				text-transform: uppercase;
			}

			.engine-label.right-aligned {
				left: auto;
				right: 10px;
			}

			#benchmark-canvas {
				width: 100% !important;
				height: 100% !important;
				display: block;
			}

			/* Centered metrics for ALL mode */
			#metrics.all-mode {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				right: auto;
				margin: 0;
				background: rgba(5, 5, 5, 0.9);
				box-shadow:
					0 0 30px rgba(0, 0, 0, 0.8),
					var(--shadow-glow);
				z-index: 1000;
			}

			#engine-legend {
				display: none;
				grid-template-columns: repeat(2, auto);
				justify-content: start;
				column-gap: 20px;
				row-gap: 4px;
				margin-top: 10px;
				padding-top: 10px;
				border-top: 1px solid var(--border);
			}

			.legend-item {
				display: flex;
				align-items: center;
				justify-content: flex-start;
				font-size: 0.65rem;
				color: var(--text-main);
				font-family: "Orbitron", sans-serif;
				text-transform: uppercase;
				letter-spacing: 1px;
				margin: 0 !important;
			}

			.legend-color {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				margin-right: 8px;
				border: 1px solid rgba(255, 255, 255, 0.2);
				box-shadow: 0 0 8px currentColor;
			}
		</style>
		<script type="module" crossorigin src="./assets/benchmarks-C4DDZQDY.js"></script>
		<link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
		<link rel="modulepreload" crossorigin href="./assets/engine-DmfIPh0w.js">
		<link rel="stylesheet" crossorigin href="./assets/examples-styles-DGfjjK-Z.css">
	</head>
	<body>
		<div id="sidebar">
			<div id="sidebar-header">
				<h2 id="sidebar-title">Scenarios</h2>
				<div id="sidebar-actions">
					<a href="index.html" class="sidebar-icon-button" title="Home"><i class="fas fa-home"></i></a>
					<button id="reset-button-mobile" class="sidebar-icon-button" title="Reset">
						<i class="fas fa-redo-alt"></i>
					</button>
					<button id="sidebar-toggle"><i class="fas fa-bars"></i></button>
				</div>
			</div>
			<ul id="scenarios-list">
				<!-- Scenarios will be dynamically generated -->
			</ul>
		</div>

		<div id="main">
			<div id="main-header">
				<div class="header-left">
					<a href="index.html" class="home-link" title="Back to Home">
						<i class="fas fa-home"></i>
						<span>Home</span>
					</a>
					<h1 id="scenario-name">Loading benchmark...</h1>
				</div>
				<div class="header-right">
					<button id="reset-button" title="Reset current benchmark">
						<i class="fas fa-redo-alt"></i>
						<span class="button-text">Reset</span>
					</button>
				</div>
			</div>

			<div id="content">
				<div class="engine-tabs">
					<div class="engine-tab active" data-engine="all">
						<span class="engine-tab-text">All Engines</span>
					</div>
					<div class="engine-tab" data-engine="gearbox2d">
						<label class="engine-toggle-wrapper">
							<input type="checkbox" class="engine-toggle" checked data-engine="gearbox2d" />
						</label>
						<span class="engine-tab-text">Gearbox2D</span>
					</div>
					<div class="engine-tab" data-engine="matterjs">
						<label class="engine-toggle-wrapper">
							<input type="checkbox" class="engine-toggle" checked data-engine="matterjs" />
						</label>
						<span class="engine-tab-text">Matter.js</span>
					</div>
					<div class="engine-tab" data-engine="p2js">
						<label class="engine-toggle-wrapper">
							<input type="checkbox" class="engine-toggle" checked data-engine="p2js" />
						</label>
						<span class="engine-tab-text">P2.js</span>
					</div>
					<div class="engine-tab" data-engine="box2dwasm">
						<label class="engine-toggle-wrapper">
							<input type="checkbox" class="engine-toggle" checked data-engine="box2dwasm" />
						</label>
						<span class="engine-tab-text">Box2D-WASM</span>
					</div>
				</div>

				<div id="canvas-container">
					<canvas id="benchmark-canvas"></canvas>
				</div>

				<div id="metrics">
					<div id="engine-name"><i class="fas fa-microchip"></i><span>Engine: -</span></div>
					<!-- <div id="step-time"><i class="fas fa-stopwatch"></i><span>Step Time: 0 μs</span></div> -->
					<div id="avg-step-time"><i class="fas fa-history"></i><span>Avg Step: 0 μs</span></div>
					<div id="bodies"><i class="fas fa-cubes"></i><span>Bodies: 0</span></div>
					<div id="memory" style="display: none"><i class="fas fa-memory"></i><span>Memory: 0 MB</span></div>
					<div id="fps"><i class="fas fa-tachometer-alt"></i><span>FPS: 0</span></div>
					<div id="metric-chart-container">
						<canvas id="metric-chart"></canvas>
					</div>
					<div id="engine-legend">
						<div class="legend-item">
							<span class="legend-color" style="color: #4ade80; background: #4ade80"></span>Gearbox2D
						</div>
						<div class="legend-item">
							<span class="legend-color" style="color: #f472b6; background: #f472b6"></span>Matter.js
						</div>
						<div class="legend-item">
							<span class="legend-color" style="color: #a855f7; background: #a855f7"></span>P2.js
						</div>
						<div class="legend-item">
							<span class="legend-color" style="color: #60a5fa; background: #60a5fa"></span>Box2D-WASM
						</div>
					</div>
				</div>

				<div
					id="status-text"
					style="
						padding: 10px 20px;
						font-size: 0.8rem;
						color: var(--text-muted);
						border-top: 1px solid var(--border);
					"
				>
					Ready to benchmark
				</div>
			</div>
		</div>

		<!-- Engine Libraries -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/p2.js/0.7.1/p2.min.js"></script>
		<script
			src="https://cdn.jsdelivr.net/npm/box2d-wasm@7.0.0/dist/umd/entry.js"
			data-box2d-dir="https://cdn.jsdelivr.net/npm/box2d-wasm@7.0.0/dist/umd"
		></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

	</body>
</html>
